name: Test macos Defaults

on: [push]

jobs:
  check-defaults:
    runs-on: macos-14
    steps:
      - name: Check current macOS settings
        run: |
          defaults read > init_defaults.txt
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: init_defaults
          path: init_defaults.txt
